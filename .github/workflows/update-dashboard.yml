name: Update Moltbook dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect latest snapshot
        run: python3 moltbook_snapshot.py

      - name: Generate dashboard data
        run: python3 generate_moltbook_dashboard.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/moltbook public/data/latest.json docs/data/latest.json
          git diff --cached --quiet || git commit -m "Update Moltbook dashboard data"
          git push
